<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Add Task - Productivity Manager</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background-color: var(--bg-card);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    .quick-add-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 20px 24px;
    }
    .quick-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .quick-header h2 {
      font-size: 16px;
      font-weight: 700;
    }
    .quick-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 10px;
      background-color: var(--accent-soft);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
      font-weight: 600;
    }
    .quick-form {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .quick-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="quick-add-container">
    <div class="quick-header">
      <span class="logo-icon" style="font-size: 16px; padding: 4px 8px;">⚡</span>
      <h2>Quick Add Task</h2>
      <span class="quick-badge">Secondary Window</span>
    </div>

    <form id="quick-add-form" class="quick-form">
      <div class="form-group">
        <label for="quick-title" class="form-label">Task Title <span class="required">*</span></label>
        <input type="text" id="quick-title" class="form-input" placeholder="What needs to get done?" required autofocus>
        <span id="quick-title-error" class="input-error" style="display: none;">Title is required</span>
      </div>

      <div class="form-group">
        <label for="quick-desc" class="form-label">Description</label>
        <textarea id="quick-desc" class="form-textarea" rows="2" placeholder="Optional details or context..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group form-col">
          <label for="quick-priority" class="form-label">Priority</label>
          <select id="quick-priority" class="form-select">
            <option value="low">Low Priority</option>
            <option value="medium" selected>Medium Priority</option>
            <option value="high">High Priority</option>
          </select>
        </div>

        <div class="form-group form-col">
          <label for="quick-due" class="form-label">Due Date</label>
          <input type="date" id="quick-due" class="form-input">
        </div>
      </div>

      <div class="quick-actions">
        <button type="button" id="quick-cancel-btn" class="btn btn-secondary">Cancel</button>
        <button type="submit" id="quick-submit-btn" class="btn btn-primary">Add Task</button>
      </div>
    </form>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script src="quick-add.js"></script>
</body>
</html>
